; rabcl_esp32 example: CAN1 ⇔ CAN2 直結試験（M5Stack Stamp-P4 / ESP32-P4 v1.x）
; platform は pioarduino（公式 espressif32 は ESP32-P4 未対応）。pioarduino 版 PlatformIO Core 6.2.0 が必要

[platformio]
default_envs = stamp_p4
boards_dir = boards

[env:stamp_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stamp-p4
framework = espidf
monitor_speed = 115200
build_flags =
    -std=gnu++17
